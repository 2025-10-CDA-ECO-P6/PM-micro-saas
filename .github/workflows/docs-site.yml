# Site de documentation (DocFX) : le corpus de `docs/` publié sur GitHub Pages.
# Construction stricte sur toute pull request qui touche le site ou le corpus ;
# publication sur la seule branche `main`.
#
# Prérequis côté dépôt, à régler une fois à la main : Settings > Pages > Source =
# « GitHub Actions ». Ce fichier ne l'active pas.
#
# La construction est le projet C# docs-site/ (DocFX utilisé comme bibliothèque, pas
# d'outil à installer) : il sort en code 1 sur tout avertissement DocFX, sur une entrée
# inutile de la table des titres, et sur un lien ou une ancre cassés dans le HTML
# construit. Le journal de l'étape nomme le défaut. La configuration vit dans
# docs-site/docfx.json, qui porte aussi l'URL du dépôt (_repoUrl), seul endroit où
# elle est écrite.
name: Site de documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"

# Une pull request plus récente rend la précédente caduque ; une publication en
# cours n'est jamais interrompue (l'artefact Pages ne doit pas rester à moitié posé).
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  construire:
    name: Construire le site (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: read — lire le corpus, rien d'autre : la construction n'écrit
    #   rien sur GitHub.
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        # Épinglée par empreinte de commit, même motif et même version que
        # controles-corpus.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer le SDK .NET
        # Épinglée par empreinte de commit, même motif et même version que
        # controles-corpus.yml.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Même sélecteur que controles-corpus.yml : le membre « 10.0 » est celui
          # que les .csproj du dépôt figent (net10.0).
          dotnet-version: "10.0.x"

      - name: Construire le site (tout avertissement fait échouer)
        run: dotnet run --project docs-site

      - name: Préparer l'artefact Pages
        # Ni préparé ni publié sur une pull request : elle ne fait que vérifier.
        if: github.event_name == 'push'
        # Épinglée par empreinte de commit.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Publier l'artefact
        if: github.event_name == 'push'
        # Épinglée par empreinte de commit.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/_site

  deployer:
    name: Déployer sur GitHub Pages
    # Une pull request ne publie jamais : le déclencheur `push` ne vise que `main`.
    if: github.event_name == 'push'
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pages: write, id-token: write — les deux droits que demande le déploiement
    #   Pages ; aucun accès au contenu du dépôt.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer
        id: deploiement
        # Épinglée par empreinte de commit.
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
