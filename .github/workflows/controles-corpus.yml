# Les cinq contrôles du corpus, lancés sur toute modification de `docs/` ou de
# l'outillage qui les porte : les quatre de l'ADR-019, § 8, plus le contrôle de tenue
# (marqueurs hors liste fermée, identifiants) de tools/VerifMarqueursIdentifiants.
#
# Chaque contrôle nomme son défaut dans sa propre sortie (lien cassé, ancre morte,
# marqueur, identifiant, TROU nouveau) : le journal de l'étape en échec suffit à
# le retrouver, aucune étape ne le résume ni ne le masque.
#
# Les étapes suivantes tournent même si une précédente a échoué
# (`!cancelled()`) : une branche qui casse un lien ET introduit un marqueur hors
# liste doit voir les deux défauts dans la même exécution, pas l'un après l'autre.
name: Contrôles du corpus

on:
  push:
    paths:
      - "docs/**"
      - "tools/**"
      - ".github/workflows/controles-corpus.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/**"
      - ".github/workflows/controles-corpus.yml"

# Une exécution plus récente de la même référence rend la précédente caduque :
# ces contrôles ne font qu'une lecture, annuler en cours de route ne laisse
# aucun état à moitié écrit (à l'inverse de recalcul-suivi-projet.yml).
concurrency:
  group: controles-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controler:
    name: Lancer les contrôles du corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: read — lire le corpus et l'outillage, rien d'autre : aucun
    #   contrôle n'écrit sur GitHub.
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        # Épinglée par empreinte de commit, même motif et même version que
        # recalcul-suivi-projet.yml. Profondeur par défaut : les contrôles ne
        # lisent que l'arbre courant (`git ls-files`), jamais l'historique.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer le SDK .NET
        # Épinglée par empreinte de commit, même motif et même version que
        # recalcul-suivi-projet.yml.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Version en support à long terme en cours à l'ouverture du build ;
          # le sélecteur « 10.0.x » suit la règle sur le seul correctif, le
          # membre « 10.0 » étant celui que les .csproj de tools/ figent
          # eux-mêmes (net10.0).
          dotnet-version: "10.0.x"

      - name: Tests de caractérisation de l'outillage
        run: dotnet test tools/Tests/CaracterisationOutils.csproj

      - name: Liens, ancres, orphelins et renvois « § » (VerifCorpus)
        if: ${{ !cancelled() }}
        run: dotnet run --project tools/VerifCorpus

      - name: Maille du plan (VerifMailleAgregat)
        if: ${{ !cancelled() }}
        run: dotnet run --project tools/VerifMailleAgregat

      - name: Marqueurs et identifiants (VerifMarqueursIdentifiants)
        if: ${{ !cancelled() }}
        # Sort en code 1 sur un écart absent des listes de référence versionnées
        # à côté de l'outil (reference-marqueurs.txt, reference-identifiants.txt).
        run: dotnet run --project tools/VerifMarqueursIdentifiants

      - name: Couverture de la recette (VerifCouvertureRecette)
        if: ${{ !cancelled() }}
        # L'outil sort en code 1 PAR CONCEPTION tant que des [TROU] ou des
        # [SOURCE RETIRÉE] sont assumés : son code de sortie ne dit donc rien ici.
        # Les lignes de ces deux classes sont comparées à la liste versionnée
        # tools/VerifCouvertureRecette/ecarts-attendus.txt ; seule une ligne
        # absente de la liste est une régression. Un code autre que 0 ou 1 est
        # une panne d'exécution (code 2) et échoue tel quel.
        # Deux gardes empêchent qu'une panne passe pour un « rien de nouveau » :
        # le build est une commande à part (sans elle, `dotnet run` sort 1 sur une
        # erreur de compilation, comme sur un TROU, et la sortie reste vide) ; et
        # un code 1 sans aucune ligne [TROU] ni [SOURCE RETIRÉE] est une panne, pas
        # un écart de couverture.
        run: |
          dotnet build tools/VerifCouvertureRecette --nologo
          code=0
          dotnet run --no-build --project tools/VerifCouvertureRecette > "$RUNNER_TEMP/recette.txt" || code=$?
          cat "$RUNNER_TEMP/recette.txt"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::VerifCouvertureRecette a échoué en panne d'exécution (code $code), pas sur un écart de couverture."
            exit "$code"
          fi
          grep -E '^\s+\[(TROU|SOURCE RETIRÉE)\] ' "$RUNNER_TEMP/recette.txt" | sed -E 's/^\s+//' | LC_ALL=C sort -u > "$RUNNER_TEMP/observe.txt" || true
          if [ "$code" -eq 1 ] && [ ! -s "$RUNNER_TEMP/observe.txt" ]; then
            echo "::error::VerifCouvertureRecette sort en code 1 sans aucune ligne [TROU] ni [SOURCE RETIRÉE] : panne, pas écart de couverture."
            exit 1
          fi
          grep -vE '^\s*(#|$)' tools/VerifCouvertureRecette/ecarts-attendus.txt | LC_ALL=C sort -u > "$RUNNER_TEMP/attendu.txt" || true
          LC_ALL=C comm -23 "$RUNNER_TEMP/observe.txt" "$RUNNER_TEMP/attendu.txt" > "$RUNNER_TEMP/nouveaux.txt"
          LC_ALL=C comm -13 "$RUNNER_TEMP/observe.txt" "$RUNNER_TEMP/attendu.txt" > "$RUNNER_TEMP/disparus.txt"
          if [ -s "$RUNNER_TEMP/disparus.txt" ]; then
            echo "Lignes de ecarts-attendus.txt que l'outil ne sort plus (à retirer de la liste) :"
            sed 's/^/  /' "$RUNNER_TEMP/disparus.txt"
          fi
          if [ -s "$RUNNER_TEMP/nouveaux.txt" ]; then
            echo "::error::VerifCouvertureRecette sort un écart absent de tools/VerifCouvertureRecette/ecarts-attendus.txt :"
            sed 's/^/  /' "$RUNNER_TEMP/nouveaux.txt"
            exit 1
          fi
          echo "VerifCouvertureRecette : aucun écart nouveau par rapport à la liste attendue ($(wc -l < "$RUNNER_TEMP/observe.txt") ligne(s) assumée(s))."
